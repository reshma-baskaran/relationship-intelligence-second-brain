name: Feature request
description: Propose a concrete workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Evidence and privacy boundary
      description: Explain how the change preserves provenance and relationship privacy.
    validations:
      required: true
